<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurora Project 식사 신청</title>
<style>
:root{--g:#176447;--bg:#f3f7f4;--line:#dce5df;--ink:#18352a;--muted:#607267}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Malgun Gothic',sans-serif}header{background:#fff;border-bottom:1px solid var(--line)}.head,.wrap{max-width:1100px;margin:auto;padding:16px 20px}.head{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:700}.brand small{display:block;font-weight:400;color:var(--muted)}button,input,select{font:inherit;min-height:44px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff}button{cursor:pointer}.primary{background:var(--g);color:#fff;border-color:var(--g)}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:16px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1}.tabs button.on{background:var(--g);color:#fff}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.fields label{font-size:14px;color:var(--muted)}.fields input{display:block;width:100%;margin-top:5px}.status{padding:10px 12px;border-radius:8px;background:#eef6f2;border:1px solid #cce3d7;color:var(--g);white-space:pre-wrap}.week{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 0}.days{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.day{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.day h3{margin:0 0 10px;font-size:16px}.slot{padding:9px 0;border-top:1px dashed var(--line)}.slot:first-of-type{border-top:0}.slot select{width:100%;margin-top:5px}.loc{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px;font-size:13px}.loc label{display:flex;align-items:center;gap:4px}.submit{width:100%;margin-top:18px}.muted{color:var(--muted);font-size:13px}@media(max-width:800px){.days{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.days{grid-template-columns:1fr}.wrap,.head{padding:12px}.tabs{gap:5px}}
</style>
</head>
<body>
<header><div class="head"><div class="brand">Aurora Project<small>현장 식사 신청 · 단일 HTML</small></div><button id="reload">새로고침</button></div></header>
<div class="wrap">
<h1>식사 신청</h1>
<div class="tabs"><button class="on" data-g="gs">GS직원</button><button data-g="partner">협력사</button><button data-g="vip">VIP</button></div>
<div class="panel"><div id="fields" class="fields"></div><p id="status" class="status">Firebase 연결 준비 중…</p></div>
<p class="muted">중식: 백반 / 조식·석식: 백반 제외 메뉴</p>
<p class="muted">마감: 중식 당일 09:00 / 석식 당일 13:00 / 조식 전일 13:00 (한국시간)</p>
<div class="week"><button id="prev">‹ 이전 주</button><strong id="weekLabel"></strong><button id="next">다음 주 ›</button></div>
<div id="days" class="days"></div>
<button id="save" class="primary submit">신청 내역 제출</button>
<p id="saveStatus" class="status"></p>
</div>
<script type="module">
const firebaseConfig={apiKey:"AIzaSyCjApU9C_w1LEmQEvRqUsjI5MyILAvE4Vc",authDomain:"meal-order-9a8d1.firebaseapp.com",projectId:"meal-order-9a8d1",storageBucket:"meal-order-9a8d1.firebasestorage.app",messagingSenderId:"288830614630",appId:"1:288830614630:web:bad7a2d8c8e8a9bcf451a7",measurementId:"G-EMZW4X4XYP"};
const MENUS=['샐러드(닭가슴살)','샐러드(오리훈제)','샐러드(치킨텐더)','샌드위치(매쉬포테이토)','샌드위치(치킨텐더)','볶음밥(김치)','볶음밥(중국식)','백반'];
const MEALS={breakfast:'조식',lunch:'중식',dinner:'석식'},LOCATIONS=['사무실','OSBL','ISBL'],NONE='신청 안 함';
const $=x=>document.getElementById(x),iso=d=>d.toISOString().slice(0,10),add=(s,n)=>iso(new Date(Date.parse(s+'T00:00:00Z')+n*86400000));
function today(){return iso(new Date(Date.now()+9*3600000))}function monday(d){const w=new Date(d+'T00:00:00Z').getUTCDay();return add(d,w===0?1:1-w)}function deadline(d,m){if(m==='lunch')return Date.parse(d+'T09:00:00+09:00');if(m==='dinner')return Date.parse(d+'T13:00:00+09:00');return Date.parse(add(d,-1)+'T13:00:00+09:00')}function closed(d,m){return Date.now()>=deadline(d,m)}function menuFor(m){return m==='lunch'?['백반']:MENUS.filter(x=>x!=='백반')}
let group='gs',week=monday(today()),api=null,db=null,drafts=new Map();
function fields(){const a=group==='gs'?[['empId','사번'],['name','이름']]:[['company',group==='vip'?'소속':'회사명'],['name','이름'],['phone','연락처']];$('fields').innerHTML=a.map(([k,l])=>'<label>'+l+'<input id="'+k+'"></label>').join('')}
function render(){ $('weekLabel').textContent=week.replaceAll('-','.')+' ~ '+add(week,5).slice(5).replace('-','.');let h='';for(let i=0;i<6;i++){const d=add(week,i);h+='<div class="day"><h3>'+['월요일','화요일','수요일','목요일','금요일','토요일'][i]+' <span class="muted">'+d+'</span></h3>';for(const [m,label] of Object.entries(MEALS)){const key=d+'|'+m,v=drafts.get(key)||{menu:NONE,location:'사무실'},isClosed=closed(d,m);h+='<div class="slot"><b>'+label+'</b> <span class="muted">'+(isClosed?'마감':'선택 가능')+'</span><select data-d="'+d+'" data-m="'+m+'" '+(isClosed?'disabled':'')+'>'+[NONE,...menuFor(m)].map(x=>'<option '+(x===v.menu?'selected':'')+'>'+x+'</option>').join('')+'</select>';if(m==='lunch'){h+='<div class="loc" id="loc_'+d+'" '+(v.menu===NONE?'style="display:none"':'')+'>'+LOCATIONS.map(x=>'<label><input type="radio" name="loc'+d+'" value="'+x+'" '+(x===v.location?'checked':'')+'> '+x+'</label>').join('')+'</div>'}h+='</div>'}h+='</div>'}$('days').innerHTML=h;for(const s of document.querySelectorAll('select[data-d]'))s.onchange=()=>{const d=s.dataset.d,m=s.dataset.m,radio=document.querySelector('input[name="loc'+d+'"]:checked');if(m==='lunch')$('loc_'+d).style.display=s.value===NONE?'none':'flex';drafts.set(d+'|'+m,{menu:s.value,location:radio?.value||'사무실'});$('saveStatus').textContent='변경한 내역 '+drafts.size+'건'};for(const r of document.querySelectorAll('input[type=radio]'))r.onchange=()=>{const d=r.name.slice(3),s=document.querySelector('select[data-d="'+d+'"][data-m="lunch"]');drafts.set(d+'|lunch',{menu:s.value,location:r.value});$('saveStatus').textContent='변경한 내역 '+drafts.size+'건'}}
async function identity(p){const src=group==='gs'?[group,p.empId]:[group,p.company,p.name,p.phone],buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(src)));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function save(){if(!api)return;const p=group==='gs'?{empId:$('empId').value.trim(),name:$('name').value.trim()}:{company:$('company').value.trim(),name:$('name').value.trim(),phone:$('phone').value.replace(/\D/g,'')};if(!p.name||group==='gs'&&!p.empId||group!=='gs'&&(!p.company||!p.phone)){alert('신청자 정보를 입력해주세요.');return}const idKey=await identity(p),batch=api.writeBatch(db),entries=[...drafts.entries()].filter(([k])=>!closed(...k.split('|')));if(!entries.length){$('saveStatus').textContent='변경한 신청 내역이 없습니다.';return}for(const [key,v] of entries){const [date,meal]=key.split('|'),[year,month,day]=date.split('-').map(Number),id=group==='gs'?p.empId+'_'+date+'_'+meal:group+'_'+idKey+'_'+date+'_'+meal;batch.set(api.doc(db,'orders',id),{group,requesterKey:idKey,empId:group==='gs'?p.empId:'',name:p.name,company:group==='gs'?'':p.company,phone:group==='gs'?'':p.phone,date,year,month,day,meal,menu:v.menu,location:meal==='lunch'?v.location:'사무실',updatedAt:api.serverTimestamp()})}try{await batch.commit();$('saveStatus').textContent='✓ '+entries.length+'건의 식사 신청이 저장되었습니다.';drafts.clear()}catch(e){$('saveStatus').textContent='저장 실패: '+(e.message||e)}}
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{group=b.dataset.g;document.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('on',x===b));drafts.clear();fields();render()});$('prev').onclick=()=>{week=add(week,-7);render()};$('next').onclick=()=>{week=add(week,7);render()};$('reload').onclick=()=>location.reload();$('save').onclick=save;fields();render();
try{const [{initializeApp},firestore]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js')]);api=firestore;db=api.getFirestore(initializeApp(firebaseConfig));$('status').textContent='Firebase 연결 완료 · 기존 meal_order와 동일한 주문 데이터 사용'}catch(e){$('status').textContent='Firebase 연결 실패: '+(e.message||e)}
</script>
</body></html>
